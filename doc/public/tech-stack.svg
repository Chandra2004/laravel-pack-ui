<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Card Shadow -->
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>

    <!-- Gradients for Tech Logos -->
    <linearGradient id="laravel-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF382C"/>
      <stop offset="100%" stop-color="#E01E12"/>
    </linearGradient>

    <linearGradient id="inertia-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9553e9"/>
      <stop offset="100%" stop-color="#6e25dc"/>
    </linearGradient>

    <linearGradient id="vite-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#41D1FF"/>
      <stop offset="100%" stop-color="#BD34FE"/>
    </linearGradient>

    <linearGradient id="vite-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEA83"/>
      <stop offset="100%" stop-color="#FFDD35"/>
      <stop offset="100%" stop-color="#FFA800"/>
    </linearGradient>

    <linearGradient id="tailwind-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <rect x="0" y="0" width="600" height="500" fill="url(#bg-glow)" />

  <!-- Center Decorative Shield -->
  <g transform="translate(300, 250)">
    <circle r="190" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.4" />
    <circle r="120" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-opacity="0.25" />
    
    <!-- Central Core Badge -->
    <circle r="50" fill="#0f172a" stroke="#6366f1" stroke-width="2.5" filter="url(#card-shadow)" />
    <path d="M-22,-10 L0,-24 L22,-10 L22,14 L0,28 L-22,14 Z" fill="none" stroke="#818cf8" stroke-width="3" stroke-linejoin="round"/>
    <path d="M0,-24 L0,28 M-22,-10 L22,14 M-22,14 L22,-10" stroke="#818cf8" stroke-width="1.8" opacity="0.6"/>
    <text x="0" y="4" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="12" fill="#ffffff" text-anchor="middle" letter-spacing="1">PACK UI</text>
  </g>

  <!-- 1. LARAVEL CARD (Top Left: 150, 90) -->
  <g transform="translate(140, 85)" filter="url(#card-shadow)">
    <rect x="-85" y="-35" width="170" height="70" rx="18" fill="#ffffff" stroke="#f1f5f9" stroke-width="1.5"/>
    <!-- Laravel Logo Mark -->
    <g transform="translate(-50, 0) scale(0.65)">
      <path d="M-28,-20 L-2,-34 L12,-26 L-14,-12 Z" fill="#FF2D20"/>
      <path d="M-2,-34 L24,-20 L24,4 L12,11 L12,-26 Z" fill="#E01A10"/>
      <path d="M-28,-20 L-14,-12 L-14,24 L-28,16 Z" fill="#FF4438"/>
      <path d="M-14,-12 L12,-26 L26,-18 L0,-4 Z" fill="#FF2D20"/>
      <path d="M0,-4 L26,-18 L26,18 L14,25 L14,3 L-14,19 Z" fill="#E01A10"/>
      <path d="M-14,24 L0,32 L0,38 L-14,30 Z" fill="#FF4438"/>
    </g>
    <text x="-15" y="-5" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="15" fill="#0f172a">Laravel</text>
    <text x="-15" y="14" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="11" fill="#64748b">v11 / v12</text>
  </g>

  <!-- 2. INERTIA.JS CARD (Top Right: 460, 85) -->
  <g transform="translate(460, 85)" filter="url(#card-shadow)">
    <rect x="-85" y="-35" width="170" height="70" rx="18" fill="#ffffff" stroke="#f1f5f9" stroke-width="1.5"/>
    <!-- Inertia Logo Mark -->
    <g transform="translate(-50, 0) scale(0.65)">
      <path d="M-26,15 L-12,15 L0,-15 L-14,-15 Z" fill="url(#inertia-grad)"/>
      <path d="M-8,15 L6,15 L18,-15 L4,-15 Z" fill="url(#inertia-grad)"/>
      <path d="M10,15 L24,15 L36,-15 L22,-15 Z" fill="url(#inertia-grad)"/>
    </g>
    <text x="-15" y="-5" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="15" fill="#0f172a">Inertia.js</text>
    <text x="-15" y="14" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="11" fill="#64748b">Vue 3 Adapter</text>
  </g>

  <!-- 3. VUE.JS CARD (Middle Left: 80, 250) -->
  <g transform="translate(85, 250)" filter="url(#card-shadow)">
    <rect x="-75" y="-35" width="150" height="70" rx="18" fill="#ffffff" stroke="#f1f5f9" stroke-width="1.5"/>
    <!-- Vue Logo Mark -->
    <g transform="translate(-40, 2) scale(0.7)">
      <polygon points="0,22 25,-20 14,-20 0,3 -14,-20 -25,-20" fill="#42b883"/>
      <polygon points="0,22 14,-20 6,-20 0,-10 -6,-20 -14,-20" fill="#35495e"/>
    </g>
    <text x="-10" y="-5" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="15" fill="#0f172a">Vue 3</text>
    <text x="-10" y="14" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="11" fill="#64748b">Composition API</text>
  </g>

  <!-- 4. VITE CARD (Middle Right: 515, 250) -->
  <g transform="translate(515, 250)" filter="url(#card-shadow)">
    <rect x="-75" y="-35" width="150" height="70" rx="18" fill="#ffffff" stroke="#f1f5f9" stroke-width="1.5"/>
    <!-- Vite Logo Mark -->
    <g transform="translate(-40, 0) scale(0.7)">
      <path d="M24,-24 L1,-20 C0,-20 -1,-19 -1,-18 L-14,6 C-14,8 -13,9 -11,9 L1,10 L-8,26 C-9,28 -7,29 -5,28 L23,-5 C25,-6 24,-9 22,-9 L10,-9 L25,-22 C26,-23 25,-24 24,-24 Z" fill="url(#vite-grad-2)"/>
      <path d="M-22,-24 C-24,-24 -25,-22 -24,-20 L-2,28 C-1,30 2,30 3,28 L25,-20 C26,-22 24,-24 22,-24 Z" fill="url(#vite-grad-1)" opacity="0.3"/>
    </g>
    <text x="-10" y="-5" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="15" fill="#0f172a">Vite</text>
    <text x="-10" y="14" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="11" fill="#64748b">Ultra Fast HMR</text>
  </g>

  <!-- 5. TAILWIND CSS CARD (Bottom Left: 140, 410) -->
  <g transform="translate(140, 410)" filter="url(#card-shadow)">
    <rect x="-85" y="-35" width="170" height="70" rx="18" fill="#ffffff" stroke="#f1f5f9" stroke-width="1.5"/>
    <!-- Tailwind Logo Mark -->
    <g transform="translate(-50, 0) scale(0.65)">
      <path d="M-15,-7 C-18,-7 -22,-3 -22,4 C-20,4 -17,2 -14,2 C-10,2 -7,8 0,8 C7,8 10,2 10,-5 C8,-5 5,-3 2,-3 C-2,-3 -5,-7 -15,-7 Z M0,-17 C-3,-17 -7,-13 -7,-6 C-5,-6 -2,-8 1,-8 C5,-8 8,-2 15,-2 C22,-2 25,-8 25,-15 C23,-15 20,-13 17,-13 C13,-13 10,-17 0,-17 Z" fill="url(#tailwind-grad)"/>
    </g>
    <text x="-15" y="-5" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="15" fill="#0f172a">Tailwind CSS</text>
    <text x="-15" y="14" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="11" fill="#64748b">v4.0 Engine</text>
  </g>

  <!-- 6. GOOGLE MATERIAL SYMBOLS CARD (Bottom Right: 460, 410) -->
  <g transform="translate(460, 410)" filter="url(#card-shadow)">
    <rect x="-95" y="-35" width="190" height="70" rx="18" fill="#ffffff" stroke="#f1f5f9" stroke-width="1.5"/>
    <!-- Google Material Symbols Star/Spark Mark -->
    <g transform="translate(-60, 0) scale(0.9)">
      <path d="M0,-16 C1,-8 8,-1 16,0 C8,1 1,8 0,16 C-1,8 -8,1 -16,0 C-8,-1 -1,-8 0,-16 Z" fill="#4285F4"/>
      <circle cx="8" cy="-8" r="3" fill="#EA4335"/>
      <circle cx="-8" cy="8" r="2.5" fill="#FBBC05"/>
      <circle cx="9" cy="8" r="2" fill="#34A853"/>
    </g>
    <text x="-25" y="-5" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="14" fill="#0f172a">Material Symbols</text>
    <text x="-25" y="14" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="11" fill="#64748b">Google Icons</text>
  </g>

</svg>
